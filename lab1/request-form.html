<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>

        <form class="request-form row g-3" action="process-request.php" method="post">
            <div class="col-md-6">
                <label for="course">Course</label>
                <input id="course" name="course" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="date">Preferred date</label>
                <input id="date" name="date" type="date" class="form-control" required>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-danger">Request session</button>
            </div>
        </form>
    </main>
</body>

</html>
